<!DOCTYPE html>
<html lang="fr">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <title>Prototype Jeu d'Allemand - UX Améliorée</title>
      <style>
            * {
                  box-sizing: border-box;
                  margin: 0;
                  padding: 0;
                  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            body {
                  background-color: #f4f7f6;
                  display: flex;
                  justify-content: center;
                  height: 100dvh;
                  margin: 0;
                  overflow: hidden;
            }

            #game-container {
                  width: 100%;
                  max-width: 500px;
                  background: white;
                  display: flex;
                  flex-direction: column;
                  position: relative;
                  box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
                  height: 100%;
            }

            header {
                  padding: 15px;
                  text-align: center;
                  background: #6c5ce7;
                  color: white;
                  font-weight: bold;
                  font-size: clamp(1rem, 4vw, 1.2rem);
                  flex-shrink: 0;
            }

            #grid-area {
                  flex: 1;
                  padding: 15px 10px;
                  display: flex;
                  flex-direction: column;
                  gap: 8px;
                  align-items: center;
                  justify-content: flex-start;
                  overflow-y: auto;
            }

            .word-row {
                  display: flex;
                  gap: 4px;
                  justify-content: center;
                  flex-wrap: nowrap;
            }

            .cell {
                  width: clamp(20px, 7vw, 35px);
                  height: clamp(20px, 7vw, 35px);
                  background: #e0e0e0;
                  border-radius: 6px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-weight: bold;
                  font-size: clamp(0.9rem, 3.5vw, 1.2rem);
                  color: #2d3436;
                  text-transform: uppercase;
            }

            .cell.found {
                  background: #00cec9;
                  color: white;
            }

            /* Saisie en cours */
            #current-input-area {
                  min-height: 50px;
                  padding: 10px;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  flex-wrap: wrap;
                  font-size: clamp(1.2rem, 5vw, 1.5rem);
                  font-weight: bold;
                  letter-spacing: 3px;
                  color: #6c5ce7;
                  flex-shrink: 0;
                  text-align: center;
            }

            /* Lettres à jouer */
            #letters-area {
                  padding: 10px 15px 25px 15px;
                  display: flex;
                  flex-wrap: wrap;
                  justify-content: center;
                  gap: 10px;
                  flex-shrink: 0;
            }

            .letter-btn {
                  width: clamp(40px, 12vw, 55px);
                  height: clamp(40px, 12vw, 55px);
                  border-radius: 50%;
                  background: #dfe6e9;
                  border: none;
                  font-size: clamp(1.1rem, 4vw, 1.5rem);
                  font-weight: bold;
                  color: #2d3436;
                  box-shadow: 0 4px 0 #b2bec3;
                  cursor: pointer;
                  text-transform: uppercase;
                  transition: 0.1s;
                  /* Pour l'effet de clic */
            }

            .letter-btn:active {
                  transform: translateY(4px);
                  box-shadow: none;
            }

            .letter-btn.used {
                  transform: scale(0.8);
                  opacity: 0.3;
                  pointer-events: none;
            }

            /* Menu QCM */
            #qcm-modal {
                  position: absolute;
                  bottom: 0;
                  left: 0;
                  right: 0;
                  background: white;
                  padding: 20px;
                  border-top-left-radius: 20px;
                  border-top-right-radius: 20px;
                  box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.2);
                  display: none;
                  flex-direction: column;
                  gap: 10px;
                  z-index: 10;
                  max-height: 85vh;
                  overflow-y: auto;
            }

            #qcm-modal h3 {
                  text-align: center;
                  margin-bottom: 10px;
                  color: #2d3436;
                  font-size: clamp(1.1rem, 4vw, 1.3rem);
            }

            .qcm-btn {
                  padding: 12px;
                  border: 2px solid #6c5ce7;
                  background: transparent;
                  border-radius: 10px;
                  font-size: clamp(0.9rem, 3.5vw, 1rem);
                  color: #6c5ce7;
                  font-weight: bold;
                  cursor: pointer;
                  transition: 0.2s;
                  text-align: center;
            }

            .qcm-btn:active {
                  background: #6c5ce7;
                  color: white;
            }

            /* Effet d'erreur */
            .shake {
                  animation: shake 0.4s;
                  color: #d63031 !important;
            }

            @keyframes shake {

                  0%,
                  100% {
                        transform: translateX(0);
                  }

                  25% {
                        transform: translateX(-5px);
                  }

                  75% {
                        transform: translateX(5px);
                  }
            }
      </style>
</head>

<body>

      <div id="game-container">
            <header id="theme-title">Thème : ...</header>

            <div id="grid-area"></div>

            <div id="current-input-area"></div>

            <div id="letters-area"></div>

            <div id="qcm-modal">
                  <h3>Que signifie ce mot ?</h3>
                  <div id="qcm-buttons" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>
      </div>

      <script>
            // --- 1. BASE DE DONNÉES (Clarifiée pour inclure des répétitions) ---
            // Les mots `WASSER` et `BEEREN` ont des lettres répétées en interne.
            const levelData = {
                  theme: "Alimentation & Nature",
                  words: [
                        { word: "WASSER", definition: "L'eau" },
                        { word: "APFEL", definition: "La pomme" },
                        { word: "BROT", definition: "Le pain" },
                        { word: "MILCH", definition: "Le lait" },
                        { word: "BEEREN", definition: "Les baies / fruits rouges" }
                  ],
                  // Le plateau contient toutes les lettres distinctes de TOUS les mots,
                  // incluant les répétitions nécessaires. Par ex: il y a deux 'S' pour `WASSER`,
                  // deux 'E' pour `BEEREN`. Ce tableau est le "plateau" des 5 étoiles dans ton image.
                  letters: ["W", "A", "S", "S", "E", "R", "A", "P", "F", "E", "L", "B", "R", "O", "T", "M", "I", "L", "C", "H", "B", "E", "E", "R", "E", "N"],
                  allDefinitions: [
                        "L'eau", "La pomme", "Le pain", "Le lait", "Les baies / fruits rouges",
                        "La viande", "Le fromage", "L'arbre", "La fleur", "Le chien"
                  ]
            };

            // --- 2. ÉTATS DU JEU ---
            let currentInput = "";
            // selectedIndices stocke l'index UNIQUE du bouton cliqué, pas la lettre.
            let selectedIndices = [];
            let foundWords = [];
            let pendingWord = null;

            // --- 3. SÉLECTEURS DOM ---
            const gridArea = document.getElementById('grid-area');
            const inputArea = document.getElementById('current-input-area');
            const lettersArea = document.getElementById('letters-area');
            const qcmModal = document.getElementById('qcm-modal');
            const qcmButtonsArea = document.getElementById('qcm-buttons');
            const themeTitle = document.getElementById('theme-title');

            // --- 4. INITIALISATION DU NIVEAU ---
            function initLevel() {
                  themeTitle.textContent = `Thème : ${levelData.theme}`;

                  levelData.words.forEach(obj => {
                        const row = document.createElement('div');
                        row.className = 'word-row';
                        row.id = `row-${obj.word}`;
                        for (let i = 0; i < obj.word.length; i++) {
                              const cell = document.createElement('div');
                              cell.className = 'cell';
                              row.appendChild(cell);
                        }
                        gridArea.appendChild(row);
                  });

                  levelData.letters.forEach((letter, index) => {
                        const btn = document.createElement('button');
                        btn.className = 'letter-btn';
                        btn.textContent = letter;
                        btn.onclick = () => handleLetterClick(letter, index, btn);
                        lettersArea.appendChild(btn);
                  });
            }

            // --- 5. LOGIQUE DE SAISIE ---
            function handleLetterClick(letter, index, btn) {
                  currentInput += letter;
                  // On stocke l'index pour s'assurer que c'est BIEN ce bouton qui a été cliqué.
                  selectedIndices.push(index);
                  btn.classList.add('used'); // UX : Rétrécit et grise le bouton
                  updateInputDisplay();
                  checkWord();
            }

            function updateInputDisplay() {
                  inputArea.textContent = currentInput;
            }

            function resetInput() {
                  currentInput = "";
                  selectedIndices = [];
                  updateInputDisplay();
                  document.querySelectorAll('.letter-btn').forEach(btn => btn.classList.remove('used'));
            }

            // --- 6. VÉRIFICATION DU MOT ---
            function checkWord() {
                  const match = levelData.words.find(w => w.word === currentInput);
                  if (match && !foundWords.includes(match.word)) {
                        pendingWord = match;
                        triggerQCM(match);
                  } else if (currentInput.length >= 7) {
                        // On peut étendre cette logique, mais pour le prototype ça suffit.
                        resetInput();
                  }
            }

            // --- 7. LOGIQUE DU QCM ---
            function triggerQCM(wordObj) {
                  let wrongOptions = levelData.allDefinitions.filter(d => d !== wordObj.definition);
                  wrongOptions = wrongOptions.sort(() => 0.5 - Math.random()).slice(0, 3);

                  let options = [wordObj.definition, ...wrongOptions];
                  options = options.sort(() => 0.5 - Math.random());

                  qcmButtonsArea.innerHTML = "";
                  options.forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = 'qcm-btn';
                        btn.textContent = opt;
                        btn.onclick = () => handleQcmAnswer(opt, wordObj.definition);
                        qcmButtonsArea.appendChild(btn);
                  });

                  qcmModal.style.display = 'flex';
            }

            function handleQcmAnswer(selected, correct) {
                  if (selected === correct) {
                        fillGrid(pendingWord.word);
                        foundWords.push(pendingWord.word);
                        qcmModal.style.display = 'none';
                        resetInput();
                        pendingWord = null;

                        if (foundWords.length === levelData.words.length) {
                              setTimeout(() => alert("Niveau Terminé !"), 500);
                        }
                  } else {
                        inputArea.classList.add('shake');
                        setTimeout(() => inputArea.classList.remove('shake'), 400);

                        qcmModal.style.display = 'none';
                        // Important : on reset les boutons (ils redeviennent utilisables)
                        resetInput();
                        pendingWord = null;
                  }
            }

            // --- 8. REMPLISSAGE DE LA GRILLE ---
            function fillGrid(word) {
                  const row = document.getElementById(`row-${word}`);
                  const cells = row.querySelectorAll('.cell');
                  for (let i = 0; i < word.length; i++) {
                        cells[i].textContent = word[i];
                        cells[i].classList.add('found');
                  }
            }

            initLevel();
      </script>
</body>

</html>
