<!DOCTYPE html>
<html lang="fr">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <title>Jeu de Mots Allemand - Hexagone & Correction</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <style>
            @keyframes shake {

                  0%,
                  100% {
                        transform: translateX(0);
                  }

                  20%,
                  60% {
                        transform: translateX(-6px);
                  }

                  40%,
                  80% {
                        transform: translateX(6px);
                  }
            }

            .shake {
                  animation: shake 0.4s ease-in-out;
                  color: #ef4444 !important;
            }

            /* Style Hexagonal pour les boutons */
            .hex-btn {
                  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            }
      </style>
</head>

<body class="bg-slate-900 text-slate-800 flex justify-center h-dvh margin-0 overflow-hidden font-sans select-none">

      <div id="game-container"
            class="w-full max-w-md bg-slate-50 h-full flex flex-col justify-between relative shadow-2xl overflow-hidden">

            <!-- En-tête / Thème -->
            <header
                  class="bg-indigo-600 text-white p-3 text-center shadow-md font-bold text-lg rounded-b-2xl flex flex-col gap-0.5">
                  <span class="text-xs uppercase tracking-widest text-indigo-200">Socle de Lettres</span>
                  <h1 id="theme-title" class="text-xl font-extrabold tracking-wider">L-A-S-T-P-O-R</h1>
            </header>

            <!-- Zone de la Grille de Mots -->
            <main id="grid-area" class="flex-1 p-3 flex flex-col items-center justify-start gap-2 overflow-y-auto">
                  <!-- Lignes générées ici -->
            </main>

            <!-- Zone de Saisie & Boutons de Restauration / Correction -->
            <div class="flex flex-col items-center gap-1 bg-slate-100 p-2 border-t border-slate-200">
                  <div id="current-input-area"
                        class="h-10 flex items-center justify-center text-2xl font-black text-indigo-600 tracking-widest uppercase">
                        <!-- Lettres en cours -->
                  </div>

                  <!-- Boutons d'Action : Effacer 1 lettre & Réinitialiser tout -->
                  <div class="flex gap-3">
                        <button onclick="removeLastLetter()"
                              class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white text-xs font-bold rounded-lg shadow transition-all flex items-center gap-1 cursor-pointer">
                              <span>⌫</span> Effacer
                        </button>
                        <button onclick="resetInput()"
                              class="px-3 py-1.5 bg-rose-500 hover:bg-rose-600 active:scale-95 text-white text-xs font-bold rounded-lg shadow transition-all flex items-center gap-1 cursor-pointer">
                              <span>↺</span> Réinitialiser
                        </button>
                  </div>
            </div>

            <!-- Plateau Géométrique (Hexagone) -->
            <footer class="p-4 pb-6 flex justify-center items-center bg-slate-200/60 shadow-inner">
                  <div id="letters-area" class="relative w-60 h-60 flex items-center justify-center">
                        <!-- Les boutons de lettres positionnés géométriquement en JS -->
                  </div>
            </footer>

            <!-- Fenêtre QCM (Modal) -->
            <div id="qcm-modal"
                  class="fixed inset-x-0 bottom-0 max-w-md mx-auto bg-white p-5 rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.2)] hidden flex-col gap-3 z-50 border-t-2 border-indigo-500">
                  <div class="text-center">
                        <span class="text-xs font-bold uppercase tracking-wider text-indigo-500">Validation du
                              Sens</span>
                        <h2 class="font-bold text-slate-800 text-base mt-0.5">Quelle est la signification exacte ?</h2>
                  </div>
                  <div id="qcm-buttons" class="flex flex-col gap-2.5 mt-1"></div>
            </div>

      </div>

      <script>
            const levelData = {
                  title: "Cluster : P - O - S - T - R - A",
                  // 7 Lettres : 1 centrale + 6 au sommet du polygone/hexagone
                  letters: ["T", "P", "O", "S", "R", "A", "S"],
                  targetWords: [
                        { word: "PASS", definition: "Document officiel permettant d'établir l'identité et de franchir les frontières" },
                        { word: "POST", definition: "Service public ou privé d'acheminement du courrier et des colis" },
                        { word: "SPORT", definition: "Activité physique exercée pour le plaisir, l'entraînement ou la compétition" },
                        { word: "ROST", definition: "Couche rougeâtre qui se forme sur le fer lorsqu'il s'oxyde à l'air humide" },
                        { word: "STAR", definition: "Personnalité publique jouissant d'une très grande renommée dans le spectacle" }
                  ],
                  externalDefinitions: [
                        "Liquide transparent, inodore et insipide indispensable à toute forme de vie",
                        "Condiment minéral blanc sous forme de petits grains utilisé pour rehausser le goût",
                        "Aliment cuit au four préparé à partir de farine, d'eau et de levure",
                        "Édifice de grande hauteur plus haut que large dominant le paysage",
                        "Images, émotions et sensations perçues durant les phases de sommeil"
                  ]
            };

            let currentInput = "";
            let selectedIndices = [];
            let foundWords = [];
            let pendingWord = null;

            const gridArea = document.getElementById('grid-area');
            const inputArea = document.getElementById('current-input-area');
            const lettersArea = document.getElementById('letters-area');
            const qcmModal = document.getElementById('qcm-modal');
            const qcmButtonsArea = document.getElementById('qcm-buttons');
            const themeTitle = document.getElementById('theme-title');

            function initLevel() {
                  themeTitle.textContent = levelData.title;

                  // Grille de mots
                  levelData.targetWords.forEach(obj => {
                        const row = document.createElement('div');
                        row.className = 'flex gap-1.5 justify-center';
                        row.id = `row-${obj.word}`;

                        for (let i = 0; i < obj.word.length; i++) {
                              const cell = document.createElement('div');
                              cell.className = 'w-8 h-8 sm:w-9 sm:h-9 border-2 border-slate-300 bg-white rounded-lg flex items-center justify-center font-black text-lg text-slate-700 uppercase shadow-sm transition-all duration-300 cell';
                              row.appendChild(cell);
                        }
                        gridArea.appendChild(row);
                  });

                  // Disposition Géométrique Hexagonale
                  renderHexagonalLetters(levelData.letters);
            }

            // Calcul géométrique du placement en hexagone
            function renderHexagonalLetters(letters) {
                  lettersArea.innerHTML = "";
                  const size = 220; // Rayon du conteneur
                  const centerX = size / 2;
                  const centerY = size / 2;
                  const radius = 80; // Distance du centre vers les sommets

                  const hasCenter = letters.length >= 7;
                  const outerLetters = hasCenter ? letters.slice(1) : letters;

                  // 1. Lettre au Centre (si au moins 7 lettres)
                  if (hasCenter) {
                        createLetterBtn(letters[0], 0, centerX, centerY, true);
                  }

                  // 2. Lettres sur les sommets de l'Hexagone (Polygone)
                  const count = outerLetters.length;
                  const angleStep = (2 * Math.PI) / count;

                  outerLetters.forEach((letter, i) => {
                        const index = hasCenter ? i + 1 : i;
                        const angle = i * angleStep - (Math.PI / 2); // Démarrer en haut (-90deg)
                        const x = centerX + radius * Math.cos(angle);
                        const y = centerY + radius * Math.sin(angle);
                        createLetterBtn(letter, index, x, y, false);
                  });
            }

            function createLetterBtn(letter, index, x, y, isCenter) {
                  const btn = document.createElement('button');

                  // Style hexagone et couleurs dynamiques
                  const baseColor = isCenter ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-white text-slate-800 border-indigo-200';
                  btn.className = `absolute w-12 h-12 hex-btn ${baseColor} border-2 font-black text-xl shadow-md active:scale-95 transition-all cursor-pointer flex items-center justify-center uppercase letter-btn`;

                  btn.style.left = `${x - 24}px`;
                  btn.style.top = `${y - 24}px`;
                  btn.textContent = letter;
                  btn.dataset.index = index;

                  btn.onclick = () => handleLetterClick(letter, index, btn);
                  lettersArea.appendChild(btn);
            }

            function handleLetterClick(letter, index, btn) {
                  currentInput += letter;
                  selectedIndices.push(index);

                  btn.classList.add('opacity-20', 'pointer-events-none', 'scale-90');

                  updateInputDisplay();
                  checkWord();
            }

            // RESTAURATION 1 : Supprimer la dernière lettre tapée
            function removeLastLetter() {
                  if (selectedIndices.length === 0) return;

                  const lastIndex = selectedIndices.pop();
                  currentInput = currentInput.slice(0, -1);

                  const btn = document.querySelector(`.letter-btn[data-index="${lastIndex}"]`);
                  if (btn) {
                        btn.classList.remove('opacity-20', 'pointer-events-none', 'scale-90');
                  }

                  updateInputDisplay();
            }

            // RESTAURATION 2 : Réinitialiser tout
            function resetInput() {
                  currentInput = "";
                  selectedIndices = [];
                  updateInputDisplay();

                  document.querySelectorAll('.letter-btn').forEach(btn => {
                        btn.classList.remove('opacity-20', 'pointer-events-none', 'scale-90');
                  });
            }

            function updateInputDisplay() {
                  inputArea.textContent = currentInput;
            }

            function checkWord() {
                  const match = levelData.targetWords.find(w => w.word === currentInput);

                  if (match && !foundWords.includes(match.word)) {
                        pendingWord = match;
                        triggerQCM(match);
                  }
            }

            function triggerQCM(wordObj) {
                  const targetDefinitions = levelData.targetWords.map(w => w.definition);
                  let poolForTraps = levelData.externalDefinitions.filter(
                        def => !targetDefinitions.includes(def) && def !== wordObj.definition
                  );

                  poolForTraps = poolForTraps.sort(() => 0.5 - Math.random()).slice(0, 3);
                  let options = [wordObj.definition, ...poolForTraps].sort(() => 0.5 - Math.random());

                  qcmButtonsArea.innerHTML = "";
                  options.forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = 'w-full p-3 border-2 border-indigo-500/30 bg-indigo-50/50 hover:bg-indigo-600 hover:text-white text-indigo-950 rounded-xl font-medium text-xs text-left transition-all active:scale-[0.98] cursor-pointer';
                        btn.textContent = opt;
                        btn.onclick = () => handleQcmAnswer(opt, wordObj.definition);
                        qcmButtonsArea.appendChild(btn);
                  });

                  qcmModal.classList.remove('hidden');
                  qcmModal.classList.add('flex');
            }

            function handleQcmAnswer(selected, correct) {
                  if (selected === correct) {
                        fillGrid(pendingWord.word);
                        foundWords.push(pendingWord.word);

                        closeQCM();
                        resetInput();
                        pendingWord = null;

                        if (foundWords.length === levelData.targetWords.length) {
                              setTimeout(() => alert("🎉 Félicitations ! Niveau terminé !"), 300);
                        }
                  } else {
                        closeQCM();
                        inputArea.classList.add('shake');
                        setTimeout(() => {
                              inputArea.classList.remove('shake');
                              resetInput();
                        }, 400);
                        pendingWord = null;
                  }
            }

            function closeQCM() {
                  qcmModal.classList.add('hidden');
                  qcmModal.classList.remove('flex');
            }

            function fillGrid(word) {
                  const row = document.getElementById(`row-${word}`);
                  const cells = row.querySelectorAll('.cell');
                  for (let i = 0; i < word.length; i++) {
                        cells[i].textContent = word[i];
                        cells[i].classList.add('bg-emerald-500', 'border-emerald-600', 'text-white', 'shadow-md');
                        cells[i].classList.remove('bg-white', 'border-slate-300', 'text-slate-700');
                  }
            }

            initLevel();
      </script>
</body>

</html>
